# ============================================================
# Release APK Workflow — Iso Tile Farm
# ------------------------------------------------------------
# How it works:
#   1. Push a new tag (e.g. `v1.0.0`) OR manually trigger
#      the workflow from the "Actions" tab in GitHub.
#   2. This workflow installs dependencies, runs typecheck +
#      tests, then asks EAS Build (expo.dev cloud) to build
#      a signed Android APK (`preview` profile from eas.json).
#   3. The finished APK is downloaded and attached to a
#      GitHub Release so you can install/share it.
#
# One-time setup:
#   * In this repo create an EAS Build token secret named
#     `EXPO_TOKEN`:
#       https://expo.dev/accounts/[your-account]/settings/access-tokens
#       GitHub → Settings → Secrets and variables → Actions
#       → New repository secret → name: EXPO_TOKEN
#   * First time, run locally once to link the project:
#       npx eas-cli login        (login with your expo account)
#       npx eas build:configure  (creates/updates app.json eas.projectId)
#     and commit the resulting app.json change.
# ============================================================
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type: major / minor / patch (defaults to patch)"
        required: false
        default: "patch"

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & tests
        run: |
          pnpm check
          pnpm test

      # ------------------------------------------------------------------
      # AUTO VERSION BUMP
      # Increments package.json "version" (major|minor|patch) using the
      # remote source of truth from EAS, so every release gets a fresh
      # incremented versionCode automatically — no manual version edits.
      # ------------------------------------------------------------------
      - name: Auto bump version
        id: bump
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          # 1) Current local version
          CURRENT=$(jq -r '.version' package.json)
          echo "Current version: ${CURRENT}"
          # 2) Compute bumped version (semver) on CI shell
          MAJOR=$(echo "${CURRENT}" | cut -d. -f1)
          MINOR=$(echo "${CURRENT}" | cut -d. -f2)
          PATCH=$(echo "${CURRENT}" | cut -d. -f3)
          case "${BUMP_TYPE}" in
            major) NEXT="${MAJOR}.0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *)     NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          echo "New version: ${NEXT}"
          # 3) Write bumped version back to package.json
          jq --arg v "${NEXT}" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          # 4) If EAS is linked (eas.projectId in app.json), ask EAS to bump
          #    the remote appVersion too (source: remote) so versionCode
          #    increments on EAS's side as well.
          HAS_PROJECT_ID=$(jq -r '.expo.eas.projectId // empty' app.json 2>/dev/null)
          if [ -n "${HAS_PROJECT_ID}" ]; then
            eas build:version:increment --platform android --non-interactive || true
          fi
          echo "new_version=${NEXT}" >> "$GITHUB_OUTPUT"
          grep '"version"' package.json

      - name: Setup Expo tools
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK with EAS (preview profile)
        id: eas_build
        run: |
          set -e
          # Start the build without waiting and capture the JSON output
          BUILD_JSON=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json)
          echo "${BUILD_JSON}" | tee /tmp/eas-build.json
          # eas-cli prints "Builds:" header lines before JSON — strip them
          BUILD_ID=$(echo "${BUILD_JSON}" | grep -Eo '\{.*\}' | jq -r '.[0].id')
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "Build started: ${BUILD_ID}"

      - name: Wait for build to finish & download APK
        id: eas_result
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
        run: |
          set -e
          ACCOUNT_SLUG=$(jq -r '.expo.owner // empty' app.json 2>/dev/null)
          SLUG=$(jq -r '.expo.slug' app.json)
          echo "account=${ACCOUNT_SLUG} slug=${SLUG}"
          # Poll build status via Expo API
          while true; do
            RESP=$(curl -s -H "Authorization: Bearer ${EXPO_TOKEN}" \
              "https://api.expo.dev/v2/accounts/${ACCOUNT_SLUG}/projects/${SLUG}/builds/${BUILD_ID}")
            STATUS=$(echo "${RESP}" | jq -r '.data.status // .errors[0].message // "UNKNOWN"')
            echo "Build status: ${STATUS}"
            case "${STATUS}" in
              FINISHED) echo "${RESP}" > /tmp/build-final.json; break ;;
              ERRORED|CANCELLED) echo "Build failed: ${RESP}"; exit 1 ;;
              *) sleep 30 ;;
            esac
          done
          ARTIFACT_URL=$(jq -r '.data.artifacts.buildUrl' /tmp/build-final.json)
          echo "artifact_url=${ARTIFACT_URL}" >> "$GITHUB_OUTPUT"
          curl -sL "${ARTIFACT_URL}" -o IsoTileFarm.apk
          ls -lh IsoTileFarm.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Iso Tile Farm APK ${{ steps.bump.outputs.new_version || 'latest' }}"
          tag_name: "v${{ steps.bump.outputs.new_version || 'latest' }}"
          files: IsoTileFarm.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
