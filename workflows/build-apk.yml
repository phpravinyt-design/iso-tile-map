name: Build Android Debug APK

on:
  push:
    branches: [ main ] # Jab bhi 'main' branch me code push hoga, ye action chalega
  workflow_dispatch: # Isse aap manually bhi GitHub par button click karke build chala sakte hain

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Expo Prebuild (Generate Android folder)
        run: npx expo prebuild --platform android

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
